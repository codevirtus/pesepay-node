name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24', '26']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # lint, typecheck, build, tests, publint --strict, attw, tarball contents.
      - run: npm run verify

  floor:
    name: engines floor · node 22.12.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      # The test suite is .mts and needs type stripping, which 22.x only
      # enables by default from 22.18 — so the floor is checked the way a
      # consumer meets it, through an install of the tarball.
      - name: install the tarball and smoke-test it
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pesepay-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/smoke-installed.mjs" .
          node smoke-installed.mjs
